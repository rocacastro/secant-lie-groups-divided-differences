
name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Recompute all high-precision trajectories
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify code and reference data
        run: python run_all.py --quick
      - name: Recompute high-precision trajectories
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python run_all.py
